<g>
</g>
<g class="terminal">
<rect x="60" y="51" height="22" width="28" rx="10" ry="10"/>
<text x="74" y="67">
x</text>
</g>
</g>
</g>
</g>
<path d=" M 123 62 h 5 a 5 5 0 0 1 5 -5 a 5 5 0 0 1 5 5 a 5 5 0 0 1 -5 5 a 5 5 0 0 1 -5 -5"/>
<path d=" M 25 62 h 10"/>
<path d=" M 113 62 h 10"/>
</g>
</svg>
