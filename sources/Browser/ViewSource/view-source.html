<!DOCTYPE html>
<html>
<head>
    <title>View Source</title>
    <style>
        {{COMMON_CSS}}
        
        /* Override any constraining styles */
        body {
            margin: 0 !important;
            padding: 0 !important;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        }
        
        .header {
            padding: 20px 30px 15px 30px;
            border-bottom: 1px solid;
            margin-bottom: 0;
        }
        
        @media (prefers-color-scheme: light) {
            .header {
                background: #ffffff;
                border-color: #e1e4e8;
            }
            
            .header h1 {
                color: #24292e;
                margin: 0 0 8px 0;
                font-size: 24px;
                font-weight: 600;
            }
            
            .header .url {
                color: #586069;
                margin: 0;
                font-size: 14px;
                word-break: break-all;
            }
        }
        
        @media (prefers-color-scheme: dark) {
            .header {
                background: #0d1117;
                border-color: #30363d;
            }
            
            .header h1 {
                color: #f0f6fc;
                margin: 0 0 8px 0;
                font-size: 24px;
                font-weight: 600;
            }
            
            .header .url {
                color: #8b949e;
                margin: 0;
                font-size: 14px;
                word-break: break-all;
            }
        }
        
        .source-content {
            padding: 0;
            margin: 0;
            flex: 1;
            min-height: calc(100vh - 120px);
        }
        
        /* Base syntax highlighting styles */
        code.source-code {
            display: block;
            white-space: pre-wrap;
            word-wrap: break-word;
            padding: 30px;
            border-radius: 0;
            font-size: 14px;
            line-height: 1.6;
            min-height: calc(100vh - 120px);
            overflow: auto;
            font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Roboto Mono', Consolas, 'Courier New', monospace;
            margin: 0;
            border: none !important;
            tab-size: 4;
            -moz-tab-size: 4;
            -o-tab-size: 4;
        }
        
        /* Light mode syntax highlighting */
        @media (prefers-color-scheme: light) {
            code.source-code {
                background: #f8f9fa;
                border: 1px solid #e9ecef;
                color: #212529;
            }
            
            .token.tag {
                color: #d73a49;
            }
            
            .token.attr-name {
                color: #6f42c1;
            }
            
            .token.attr-value {
                color: #032f62;
            }
            
            .token.punctuation {
                color: #6a737d;
            }
            
            .token.comment {
                color: #6a737d;
                font-style: italic;
            }
            
            .token.doctype {
                color: #6a737d;
                font-weight: bold;
            }
            
            .token.string {
                color: #032f62;
            }
            
            .token.keyword {
                color: #d73a49;
            }
            
            .token.operator {
                color: #d73a49;
            }
            
            .token.entity {
                color: #22863a;
            }
            
            .token.prolog {
                color: #6a737d;
            }
            
            .token.cdata {
                color: #6a737d;
                font-weight: bold;
            }
        }
        
        /* Dark mode syntax highlighting */
        @media (prefers-color-scheme: dark) {
            code.source-code {
                background: #0d1117;
                border: 1px solid #30363d;
                color: #c9d1d9;
            }
            
            .token.tag {
                color: #7ee787;
            }
            
            .token.attr-name {
                color: #79c0ff;
            }
            
            .token.attr-value {
                color: #a5d6ff;
            }
            
            .token.punctuation {
                color: #8b949e;
            }
            
            .token.comment {
                color: #8b949e;
                font-style: italic;
            }
            
            .token.doctype {
                color: #8b949e;
                font-weight: bold;
            }
            
            .token.string {
                color: #a5d6ff;
            }
            
            .token.keyword {
                color: #ff7b72;
            }
            
            .token.operator {
                color: #ff7b72;
            }
            
            .token.entity {
                color: #7ee787;
            }
            
            .token.prolog {
                color: #8b949e;
            }
            
            .token.cdata {
                color: #8b949e;
                font-weight: bold;
            }
        }
        
        /* Additional styling for better readability */
        .token.boolean,
        .token.number {
            color: inherit;
        }
        
        /* Clickable link styles */
        .source-link {
            text-decoration: underline;
            cursor: pointer;
        }
        
        @media (prefers-color-scheme: light) {
            .source-link {
                color: #0366d6;
            }
            
            .source-link:hover {
                color: #0256cc;
            }
        }
        
        @media (prefers-color-scheme: dark) {
            .source-link {
                color: #58a6ff;
            }
            
            .source-link:hover {
                color: #79c0ff;
            }
        }
        
        /* Selection highlighting */
        code.source-code::selection,
        code.source-code *::selection {
            background-color: rgba(0, 122, 255, 0.3);
        }
        
        @media (prefers-color-scheme: dark) {
            code.source-code::selection,
            code.source-code *::selection {
                background-color: rgba(255, 255, 255, 0.2);
            }
        }
        
        /* Custom scrollbar for webkit browsers */
        code.source-code::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        @media (prefers-color-scheme: light) {
            code.source-code::-webkit-scrollbar-track {
                background: #f1f3f4;
                border-radius: 4px;
            }
            
            code.source-code::-webkit-scrollbar-thumb {
                background: #dadce0;
                border-radius: 4px;
            }
            
            code.source-code::-webkit-scrollbar-thumb:hover {
                background: #bdc1c6;
            }
        }
        
        @media (prefers-color-scheme: dark) {
            code.source-code::-webkit-scrollbar-track {
                background: #21262d;
                border-radius: 4px;
            }
            
            code.source-code::-webkit-scrollbar-thumb {
                background: #484f58;
                border-radius: 4px;
            }
            
            code.source-code::-webkit-scrollbar-thumb:hover {
                background: #656c76;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>💻 Page Source</h1>
        <p class="url" id="source-url" data-url="{{URL}}">{{URL}}</p>
    </div>

    <div class="source-content">
        <code class="language-html source-code">{{SOURCE}}</code>
    </div>
    
    <script>
        // Simple HTML syntax highlighter - no external dependencies
        document.addEventListener('DOMContentLoaded', function() {
            const codeElement = document.querySelector('.source-code');
            if (!codeElement) return;

            // innerHTML serializes the source text with &, < and > escaped. The
            // highlighter's regexes work on that escaped text, so the links are
            // swapped out for placeholders while it runs; otherwise it would
            // rewrite entities inside the links' href attributes.
            // U+0001 marks a placeholder, so escape any already in the source.
            const links = [];
            let html = codeElement.innerHTML.replace(/\u0001/g, '&#1;');
            html = makeUrlsClickable(html, links); // First make URLs clickable
            html = applySyntaxHighlighting(html); // Then apply syntax highlighting
            codeElement.innerHTML = html.replace(/\u0001(\d+)\u0002/g, (match, index) => links[Number(index)]);
        });

        function applySyntaxHighlighting(html) {
            // Highlight comments first (to avoid interfering with tag highlighting)
            html = html.replace(/(&lt;!--[\s\S]*?--&gt;)/g, '<span class="token comment">$1</span>');

            // Highlight DOCTYPE
            html = html.replace(/(&lt;!DOCTYPE[^&]*&gt;)/gi, '<span class="token doctype">$1</span>');

            // Highlight CDATA sections
            html = html.replace(/(&lt;!\[CDATA\[[\s\S]*?\]\]&gt;)/g, '<span class="token cdata">$1</span>');

            // Highlight complete HTML tags in one pass
            html = html.replace(/(&lt;\/?)([a-zA-Z][a-zA-Z0-9]*)((?:\s[^&]*?)?)\s*(&gt;)/g, function(match, openBracket, tagName, attributes, closeBracket) {
                let result = '<span class="token tag">' + openBracket + tagName + '</span>';

                if (attributes) {
                    // Highlight attributes within the tag. innerHTML doesn't escape
                    // quotes in text, so values are in plain quotes. `attributes`
                    // has no & (so no escaped < or >), and the value is only ever
                    // that serialized text wrapped in a span, so it can't become markup.
                    let processedAttrs = attributes.replace(/\s([a-zA-Z][a-zA-Z0-9-]*)(=)("[^"]*"|'[^']*')/g,
                        ' <span class="token attr-name">$1</span><span class="token punctuation">$2</span><span class="token attr-value">$3</span>');
                    result += processedAttrs;
                }

                result += '<span class="token tag">' + closeBracket + '</span>';
                return result;
            });

            // Highlight entities
            html = html.replace(/(&[a-zA-Z][a-zA-Z0-9]*;|&#[0-9]+;|&#x[0-9a-fA-F]+;)/g, '<span class="token entity">$1</span>');

            return html;
        }

        // Decodes HTML character references. A textarea parses its content as
        // text, so no markup in `text` is ever created or run.
        function decodeHTML(text) {
            const textarea = document.createElement('textarea');
            textarea.innerHTML = text;
            return textarea.value;
        }

        // Decodes character references the way an attribute value does, which
        // differs from text: in an attribute, “&region=” stays as is rather than
        // becoming “®ion=”. The parsed document is inert, and escaping quotes
        // keeps `text` inside the attribute.
        function decodeAttributeValue(text) {
            const doc = new DOMParser().parseFromString(`<a title="${text.replace(/"/g, '&quot;')}"></a>`, 'text/html');
            const anchor = doc.querySelector('a');
            return anchor ? anchor.getAttribute('title') : text;
        }

        function escapeHTML(text) {
            return text.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        // Replaces each URL in `html` (serialized source text) with a placeholder
        // and appends the link for it to `links`.
        function makeUrlsClickable(html, links) {
            // Get the current page URL to resolve relative URLs
            const currentURL = document.getElementById('source-url').dataset.url;
            // Only a local file's source links to files.
            const allowedProtocols = ['http:', 'https:'];
            try {
                if (new URL(currentURL).protocol === 'file:') {
                    allowedProtocols.push('file:');
                }
            } catch (e) {
            }

            // `url` is the serialized text of an attribute value. Returns a
            // placeholder for its link, or null if it should not be a link.
            function placeholderForLink(url) {
                // Undo innerHTML's escaping to get the source text, then decode the
                // source's own character references as the browser would.
                const target = decodeAttributeValue(decodeHTML(url)).trim();
                if (!target || target === '#') {
                    return null;
                }
                let resolved;
                try {
                    resolved = new URL(target, currentURL);
                } catch (e) {
                    return null;
                }
                if (!allowedProtocols.includes(resolved.protocol)) {
                    return null;
                }
                links.push(`<a href="${escapeHTML(resolved.href)}" target="_blank" rel="noopener noreferrer" class="source-link">${url}</a>`);
                return '\u0001' + (links.length - 1) + '\u0002';
            }

            // Simple approach: find URL-like patterns in the displayed text and make them clickable
            // This preserves the exact HTML structure while making URLs clickable

            // Handle escaped quotes: attr=&quot;url&quot;
            html = html.replace(/(\s(?:src|href|action|data|poster|background)=&quot;)([^&"]+?)(&quot;)/gi,
                (match, before, url, after) => {
                    const placeholder = placeholderForLink(url);
                    return placeholder === null ? match : `${before}${placeholder}${after}`;
                });

            // Handle regular quotes: attr="url"
            html = html.replace(/(\s(?:src|href|action|data|poster|background)=")([^"]+?)(")/gi,
                (match, before, url, after) => {
                    const placeholder = placeholderForLink(url);
                    return placeholder === null ? match : `${before}${placeholder}${after}`;
                });

            // Handle CSS url() patterns
            html = html.replace(/(url\()(&quot;|&#39;|")([^&'"]+?)(\2)(\))/gi,
                (match, before, quote1, url, quote2, after) => {
                    const placeholder = placeholderForLink(url);
                    return placeholder === null ? match : `${before}${quote1}${placeholder}${quote2}${after}`;
                });

            return html;
        }
    </script>
</body>
</html>
